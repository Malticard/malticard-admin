<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta http-equiv="Content-Security-Policy" content="img-src * 'self' data: https:;">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="malticard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <title>Malticard</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    :root {
      --primary-blue: #1949B9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--primary-blue);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loader-container {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .circle {
      position: absolute;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 100%;
      height: 100%;
    }

    .circle-outer {
      border-top-color: #ffffff;
    }

    .circle-middle {
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      border-right-color: #ffffff;
      opacity: 0.8;
    }

    .circle-inner {
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
      border-bottom-color: #ffffff;
      opacity: 0.6;
    }

    .loading-text {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.2rem;
      white-space: nowrap;
    }

    .dots span {
      opacity: 0;
    }
  </style>
  <script type="text/javascript">
    window.flutterWebRenderer = "html";
  </script>
  <script id="splash-screen-script">
    // GSAP Animations
    document.addEventListener('DOMContentLoaded', () => {
      // Rotate circles
      gsap.to('.circle-outer', {
        rotation: 360,
        duration: 2,
        repeat: -1,
        ease: 'none'
      });

      gsap.to('.circle-middle', {
        rotation: -360,
        duration: 3,
        repeat: -1,
        ease: 'none'
      });

      gsap.to('.circle-inner', {
        rotation: 360,
        duration: 4,
        repeat: -1,
        ease: 'none'
      });

      // Logo pulse
      gsap.to('.logo-container', {
        scale: 1.1,
        duration: 1,
        repeat: -1,
        yoyo: true,
        ease: 'power1.inOut'
      });

      // Animate dots
      const dots = document.querySelectorAll('.dots span');
      gsap.to(dots, {
        opacity: 1,
        duration: 0.5,
        stagger: {
          each: 0.2,
          repeat: -1,
          yoyo: true
        }
      });
    });

    function removeSplashFromWeb() {
      gsap.to('.loader-container', {
        opacity: 0,
        duration: 0.5,
        onComplete: () => {
          document.getElementById("splash")?.remove();
          document.getElementById("splash-branding")?.remove();
          document.body.style.background = "transparent";
        }
      });
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
</head>

<body>
  <div class="loader-container">

    <div class="circle circle-outer"></div>
    <div class="circle circle-middle"></div>
    <div class="circle circle-inner"></div>
    <div class="loading-text">
      Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>
</body>

</html>
